<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Color Blindness Sequence</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .home-btn {
            background-color: #333333;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 3vh;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .home-btn:hover {
            background-color: #444444;
        }

        .input-label {
            color: #ffffff;
            font-weight: bold;
            font-size: 1vw;
            margin-left: 1vw;
        }

        .number-input {
            padding: 6px;
            font-size: 2vw;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 7vw;
        }
    </style>
</head>
<body>
    <header class="header">
        <!-- Replace href="#" with your landing page URL if needed -->
        <a href="index.html" class="home-btn">🏠 Home</a>

        <!-- Label to the right of the home button -->
        <label for="repeatCount" class="input-label">Enter repeat Count:</label>
        <!-- Number Input Field -->
        <input type="number" id="repeatCount" name="repeatCount" class="number-input" min="1" max="1000" value="1">

        <!-- Label to the right of the input repeat -->
        <label for="Speed" class="input-label">Enter speed:</label>
        <!-- Number Input Field -->
        <input type="number" id="Speed" name="Speed" class="number-input" min="1" max="1000" value="1000">

        <label for="RnGIntensity" class="input-label">Enter R&G Intensity:</label>
        <!-- Number Input Field -->
        <input type="number" id="RnGIntensity" name="RnGIntensity" class="number-input" min="1" max="100" value="75">

        <label for="bYIntensity" class="input-label">Enter bright Y:</label>
        <!-- Number Input Field -->
        <input type="number" id="bYIntensity" name="bYIntensity" class="number-input" min="1" max="100" value="75">

        <label for="dYIntensity" class="input-label">Enter dark Y:</label>
        <!-- Number Input Field -->
        <input type="number" id="dYIntensity" name="dYIntensity" class="number-input" min="1" max="100" value="50">
    </header>

    <canvas id="mainCanvas"></canvas>

    <canvas id="frame1"></canvas>
    <canvas id="frame2"></canvas>

    <script>
        const mainCanvas = document.getElementById('mainCanvas');
        const ctx = mainCanvas.getContext('2d');

        // 1. Define the number of horizontal repeats
        let REPEAT_COUNT = 1;

        // 2. Create an offscreen canvas to hold the original drawing
        let sourceCanvas = document.createElement('canvas');
        let sourceCtx = sourceCanvas.getContext('2d');
        
        // Define the native size of your original graphic
        sourceCanvas.width = screen.width;
        sourceCanvas.height = screen.height;

        let frameList = ["frame1", "frame2", "frame3", "frame4"];
        let frameListTemp = ["Tempframe1", "Tempframe2", "Tempframe3", "Tempframe4"];

        function createTempOffScreenCanvases() {
            for (i = 0; i < frameListTemp.length; i++){
                let name = frameListTemp[i];
                let framesCanvas = document.createElement("canvas");
                framesCanvas.id = name;
                console.log("inside TempcreateOffScreenCanvases name: " + name + " id:" + framesCanvas.id);
                //let framesCtx = framesCanvas.getContext('2d');
                // Define the native size of your original graphic
                framesCanvas.width = screen.width;
                framesCanvas.height = screen.height;
                document.body.appendChild(framesCanvas);
                let tempcanvasOffscreen = document.getElementById(name);
                if (tempcanvasOffscreen) { console.log("    temp canvas id is good " + name); }
            }
        }
        
        function createOffScreenCanvases() {

                let newname = frameList[i];
                let newframesCanvas = document.createElement("canvas");
                newframesCanvas.id = newname;

            }
        }

        console.log(" nameit framelistTemp[0]: " + Tempnameit);

        // 3. Draw your original artwork into the offscreen canvas
        function drawSourcePattern() {
            // Background
            sourceCtx.fillStyle = '#3498db';
            sourceCtx.fillRect(0, 0, sourceCanvas.width, sourceCanvas.height);
            
            // A design element to show the horizontal stretching
            sourceCtx.fillStyle = '#f1c40f';
            sourceCtx.beginPath();
            sourceCtx.arc(sourceCanvas.width / 2, sourceCanvas.height / 2, 50, 0, Math.PI * 2);
            sourceCtx.fill();

            // Border to clearly see the edges of each repeat
            sourceCtx.strokeStyle = '#000000';
            sourceCtx.lineWidth = 20;
            sourceCtx.strokeRect(0, 0, sourceCanvas.width, sourceCanvas.height);
        }

        // 4. Render and scale onto the main full-screen canvas
        function render() {
            // Set main canvas to match the screen window size
            mainCanvas.width = window.innerWidth;
            mainCanvas.height = window.innerHeight;

            // Calculate how wide each scaled canvas needs to be to fill the screen
            const scaledWidth = mainCanvas.width / REPEAT_COUNT;
            //console.log(" repeat count: " + REPEAT_COUNT + " innerwidth: " + mainCanvas.width + " scaledwidth: ", scaledWidth + " source width: " + sourceCanvas.width);
            
            // Keep the height identical to your source design (unscaled)
            // Or change this to mainCanvas.height if you want it to fill the screen vertically too
            const scaledHeight = sourceCanvas.height; 

            // Clear the main screen
            ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);

            // Loop and draw the source canvas across the width
            for (let i = 0; i < REPEAT_COUNT; i++) {
                const xPosition = i * scaledWidth;
                //console.log("xposition: " + xPosition);
                ctx.drawImage(
                    sourceCanvas, 
                    0, 0, sourceCanvas.width, sourceCanvas.height, // Source dimensions
                    xPosition, 0, scaledWidth, scaledHeight        // Destination dimensions (Width scaled, height native)
                );
            }
        }
        // 4. Render and scale onto the main full-screen canvas
        function renderOnce(offscreencanvas) {
            // Set main canvas to match the screen window size
            mainCanvas.width = window.innerWidth;
            mainCanvas.height = window.innerHeight;
            let canvasOffscreen = document.getElementById(offscreencanvas);
            let ctxOffscreen = canvasOffscreen.getContext('2d');

            // Calculate how wide each scaled canvas needs to be to fill the screen
            let scaledWidth = mainCanvas.width;
            
            
            // Keep the height identical to your source design (unscaled)
            // Or change this to mainCanvas.height if you want it to fill the screen vertically too
            let scaledHeight = canvasOffscreen.height; 

            // Clear the main screen
            //ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
            //ctx.imageSmoothingEnabled = false; // Forces a cache state refresh
            let xPosition = 0;
            console.log(" inside renderonce" + " canvas id: " + canvasOffscreen.id + " xpos: " + xPosition + " width: " + canvasOffscreen.width + " scaledwidth: ", scaledWidth + " source width: " + canvasOffscreen.width);
            ctx.drawImage(
                    canvasOffscreen, 
                    0, 0, canvasOffscreen.width, canvasOffscreen.height, // Source dimensions
                    xPosition, 0, scaledWidth, scaledHeight        // Destination dimensions (Width scaled, height native)
                );
            //ctx.fillStyle = "rgb(150,20,50)";
            //ctx.fillRect(0, 0, 100, 200);
        }

        // bars from here
        let desatPercent = "10%";
        let redPercent = "75%";
        let greenPercent = "75%";
        let brightYellowPercent = "75%";
        let darkYellowPercent = "50%";
        let colorsF1 = [];
        let colorsF2 = [];
        let colorsF3 = [];
        let colorsF4 = [];
        let RedRGB = " ";
        let GreenRGB = " ";
        let BrightYellowRGB = " ";
        let DarkYellowRGB = " ";
        
        function creatergbArrays() {
          RedRGB = "rgb( " + redPercent + " , " + desatPercent + " , " + desatPercent + " ) ";
          GreenRGB = "rgb( " + desatPercent + " , " + greenPercent + " , " + desatPercent + " ) ";
          BrightYellowRGB = "rgb( " + brightYellowPercent + " , " + brightYellowPercent + " , " + desatPercent + " ) ";
          DarkYellowRGB = "rgb( " + darkYellowPercent + " , " + darkYellowPercent + " , " + desatPercent + " ) ";

          colorsF1 = [
            RedRGB,  // Red
            GreenRGB,  // Green
            RedRGB,  // Red
            GreenRGB  // Green
          ];

          colorsF2 = [
            DarkYellowRGB,  // Dark Yellow
            BrightYellowRGB,  // Light Yellow
            DarkYellowRGB,  // Dark Yellow
            BrightYellowRGB,  // Light Yellow
            DarkYellowRGB  // Dark Yellow
          ];

          colorsF3 = [
            GreenRGB,  // Green
            RedRGB,  // Red
            GreenRGB, // Green
            RedRGB  // Red
          ];

          colorsF4 = [
            BrightYellowRGB,  // Light Yellow
            DarkYellowRGB,  // Dark Yellow
            BrightYellowRGB,  // Light Yellow
            DarkYellowRGB,  // Dark Yellow
            BrightYellowRGB  // Light Yellow
          ];
        }
        function drawBars(offscreencanvas,colors) {
            // Set canvas resolution to match the window size
            console.log("inside drawBars: " + offscreencanvas);
            const canvasOffscreen = document.getElementById(offscreencanvas);
            const ctxOffscreen = canvasOffscreen.getContext('2d');
            canvasOffscreen.width = screen.width;
            canvasOffscreen.height = screen.height;
            
            //colors = colorsF3;
            
            let totalBars = colors.length;
            console.log("inside drawBars offscreen canvas:" + canvasOffscreen.id + " width:" + canvasOffscreen.width);
            //console.log(" bars offscreenwidth: " + canvasOffscreen.width + " offscreen canvas: " + offscreencanvas + " totalbars: " + totalBars);

            if ( totalBars > 4 ) {
                totalBars = totalBars;
            }
            
            // Calculate individual bar width so that exactly 'totalBars' fit the screen width
            const barWidth = canvasOffscreen.width / 4;
            
            // For Yellow colours calculate the starting X offset (half a bar width to the left)
            let startX = 0;
            if ( totalBars > 4) {
                startX = -barWidth / 2;
            }

            // Draw 6 bars so the screen stays completely filled despite the negative offset
            for (let i = 0; i <= totalBars; i++) {
                // Use modulo to cycle through the 5 colors for the 6th bar
                ctxOffscreen.fillStyle = colors[i % totalBars];
                
                // Calculate the X position for the current bar
                const xPos = startX + (i * barWidth);
                console.log( "     xPos: " + xPos + " barwidth: " + barWidth + " fill color:" + colors[i % totalBars])
                // Draw the vertical bar spanning the full height of the canvas
                ctxOffscreen.fillRect(xPos, 0, barWidth, canvasOffscreen.height);
            }
        }

        // Initialize
        function refreshBars() {
          creatergbArrays();
          drawBars("frame1",colorsF1);
          console.log("inside refreshBars colorsF1:" + colorsF1);
          drawBars("frame2",colorsF2);
          console.log("inside refreshBars colorsF2:" + colorsF2);
          drawBars("frame3",colorsF3);
          console.log("inside refreshBars colorsF3:" + colorsF3);
          drawBars("frame4",colorsF4);
          console.log("inside refreshBars colorsF4:" + colorsF4);
          console.log("inside refreshBars Red percent:" + RedRGB + " Green percent:" + GreenRGB + "bright yellow percent:" + BrightYellowRGB + " dark yellow percent:" + DarkYellowRGB );
        }
        createOffScreenCanvases();
        refreshBars();
        //drawBars("mainCanvas",colorsF2);mainCanvas
        



        function generateRepeatedBarsFrames(repeatcount){
            for (i=0; i < frameListTemp.length; i++) {
                const canvasIn = document.getElementById(frameList[i]);
                const ctxIn = canvasIn.getContext('2d');
                const canvasOut = document.getElementById(frameListTemp[i]);
                const ctxOut = canvasOut.getContext('2d');
                canvasOut.width = screen.width;
                canvasOut.height = screen.height;

                // Calculate how wide each scaled canvas needs to be to fill the screen
                const scaledWidth = canvasIn.width / repeatcount;
                console.log(" inside generateRepeatedBarsFrames repeat count: " + repeatcount + " width: " + canvasOut.width + " scaledwidth: ", scaledWidth + " source width: " + sourceCanvas.width);
            
                // Keep the height identical to your source design (unscaled)
                // Or change this to mainCanvas.height if you want it to fill the screen vertically too
                const scaledHeight = canvasIn.height; 

                // Clear the screen
                ctxOut.clearRect(0, 0, canvasOut.width, canvasOut.height);
                console.log("     canvasIn:" + frameList[i] +" canvasOut:" + frameListTemp[i] + " repeat count: " + repeatcount);
                // Loop and draw the source canvas across the width
                for (copy = 0; copy < repeatcount; copy++) {
                    const xPosition = copy * scaledWidth;
                    console.log("     xposition: " + xPosition);
                    ctxOut.drawImage(
                        canvasIn, 
                        0, 0, canvasIn.width, canvasIn.height, // Source dimensions
                        xPosition, 0, scaledWidth, scaledHeight        // Destination dimensions (Width scaled, height native)
                    );
                }

            }
        }

        let numberofframes = frameList.length;
        let currentIndex = 0;
        let delay = 1000; // default 24fps=42 1 second=1000 ms
        let timerId = null;
        let isRunning = true;

        function runloop() {
              let thisframeName = frameList[currentIndex];
              if ( REPEAT_COUNT > 1) {
                thisframeName = frameListTemp[currentIndex];
              }
              let thisframe = document.getElementById(thisframeName);

              let thisframeCtx = thisframe.getContext('2d');
              if ( currentIndex == 0) { 
                console.log(" ");
              }
              console.log("inside runloop frame: " + frameList[currentIndex] + " thisframe: " + thisframe.id + " thiswidth: " + thisframe.width + "  ctxwidth:" + mainCanvas.width);
              //ctx.drawImage(thisframe,0,0, thisframe.width, thisframe.height,0,0,mainCanvas.width, mainCanvas.height);
              //ctx.fillStyle = "rgb(150,20,50)";
              //ctx.fillRect(0, 0, 100, 200);
              renderOnce(thisframeName);
              //renderOnce("frame1");
              // Move to the next index, resetting to 0 when reaching the end
              currentIndex = (currentIndex + 1) % numberofframes;

              // Schedule the next execution with the current delay value
              //console.log("delay: " + delay);
              timerId = setTimeout(runloop, delay);
        }

        //drawSourcePattern();
        generateRepeatedBarsFrames(REPEAT_COUNT);
        //let thisoffscreencanvas = document.getElementById("frame3");
        //ctx.drawImage(thisoffscreencanvas,0,0);
        //render();

        // Select the input field by its ID
        let inputField = document.getElementById('repeatCount');

        // Listen for keypress events on the input field
        inputField.addEventListener('keydown', function(event) {
            // Check if the pressed key is 'Enter'
            if (event.key === 'Enter') {
                // Prevent default form submission behavior if applicable
                event.preventDefault(); 
                
                // Get the text inside the input box
                let enteredValue = inputField.value;
                if (enteredValue < 1) {
                  inputField.value = 1;
                  enteredValue = 1;
                }
                
                // Show the alert box with the value
                REPEAT_COUNT = enteredValue;
                currentIndex = 0;
                refreshBars();
                generateRepeatedBarsFrames(REPEAT_COUNT);
                alert("Repeat count entered: " + enteredValue + " frame speed: " + delay);
                timerId = setTimeout(runloop, delay);
                runloop();
            }
        });        

        // Select the input field by its ID
        let inputField2 = document.getElementById('Speed');

        // Listen for keypress events on the input field

                // Show the alert box with the value
                desatPercent = "10%";

                //brightYellowPercent = "75%";
                //darkYellowPercent = "50%";

        // Select the input field by its ID
        let inputField4 = document.getElementById('bYIntensity');

        // Listen for keypress events on the input field
        inputField4.addEventListener('keydown', function(event) {
            // Check if the pressed key is 'Enter'
            if (event.key === 'Enter') {
                // Prevent default form submission behavior if applicable

                // Get the text inside the input box
                let enteredValue = inputField4.value;
                if (enteredValue < 1) {
                  inputField2.value = 1;

                }
                
                // Show the alert box with the value
                desatPercent = "10%";
                //redPercent = enteredValue + "%";
                //greenPercent = enteredValue + "%";
                brightYellowPercent = enteredValue + "%";
                //darkYellowPercent = "50%";
                currentIndex = 0;
                refreshBars();
                generateRepeatedBarsFrames(REPEAT_COUNT);
                alert("bright Yellow entered: " + brightYellowPercent + " repeat count: " + REPEAT_COUNT + " frame speed: "+ delay);
                timerId = setTimeout(runloop, delay);
                runloop();
            }
        });

        // Select the input field by its ID
        let inputField5 = document.getElementById('dYIntensity');

        // Listen for keypress events on the input field
        inputField5.addEventListener('keydown', function(event) {
            // Check if the pressed key is 'Enter'
            if (event.key === 'Enter') {
                // Prevent default form submission behavior if applicable
                event.preventDefault(); 
                
                // Get the text inside the input box
                let enteredValue = inputField5.value;
                if (enteredValue < 1) {
                  inputField2.value = 1;
                  enteredValue = 1;
                }
                
                // Show the alert box with the value
                desatPercent = "10%";
                //redPercent = enteredValue + "%";
                //greenPercent = enteredValue + "%";
                darkYellowPercent = enteredValue + "%";
                //darkYellowPercent = "50%";
                currentIndex = 0;
                refreshBars();
                generateRepeatedBarsFrames(REPEAT_COUNT);
                alert("dark Yellow entered: " + darkYellowPercent + " repeat count: " + REPEAT_COUNT + " frame speed: "+ delay);
                timerId = setTimeout(runloop, delay);
                runloop();
            }
        });

        //drawBars("mainCanvas",colorsF2);
        //drawSourcePattern();
        //generateRepeatedBarsFrames(REPEAT_COUNT);
        refreshBars();
        generateRepeatedBarsFrames(REPEAT_COUNT);
        //renderOnce("Tempframe1");
        runloop();
        // Handle window resizing
        //let thiscanvas = document.getElementById("frame1");
        //ctx.drawImage(
        //            thiscanvas, 
        //            0, 0, thiscanvas.width, thiscanvas.height, // Source dimensions
