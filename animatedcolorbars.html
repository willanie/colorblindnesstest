<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Color Blindness Sequence</title>
    <style>
        /* Remove default margins and hide scrollbars to perfectly fill the viewport */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111; /* Dark background to see the edge offsets clearly  huh*/
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .home-btn {
            background-color: #333333;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 3vh;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .home-btn:hover {
            background-color: #444444;
        }

        .input-label {
            color: #ffffff;
            font-weight: bold;
            font-size: 3vh;
            margin-left: 1vw;
        }

        .number-input {
            padding: 6px;
            font-size: 3vh;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 80px;
        }
    </style>
</head>
<body>
    <header class="header">
        <!-- Replace href="#" with your landing page URL if needed -->
        <a href="index.html" class="home-btn">🏠 Home</a>
        <!-- Label to the right of the home button -->
        <label for="quantity" class="input-label">Enter Delay and hit enter:</label>
        
        <!-- Number Input Field -->
        <input type="number" id="quantity" name="quantity" class="number-input" min="1" max="1000" value="42">
    </header>

    <canvas id="barCanvas"></canvas>

    <script>
        const canvas = document.getElementById('barCanvas');
        const ctx = canvas.getContext('2d');
        let desatPercent = "10%";
        let redPercent = "75%";
        let greenPercent = "75%";
        let brightYellowPercent = "75%";
        let darkYellowPercent = "50%";

        //const RedRGB = "rgb(${redPercent}, ${desatPercent}, ${desatPercent})";
        //const GreenRGB = "`rgb(${desatPercent}, ${greenPercent}, ${desatPercent})`";
        //const BrightYellowRGB = "`rgb(${brightYellowPercent}, ${brightYellowPercent}, ${desatPercent})`";
        //const DarkYellowRGB = "`rgb(${darkYellowPercent}, ${darkYellowPercent}, ${desatPercent})`";

        let RedRGB = "rgb( " + redPercent + " , " + desatPercent + " , " + desatPercent + " ) ";
        let GreenRGB = "rgb( " + desatPercent + " , " + greenPercent + " , " + desatPercent + " ) ";
        let BrightYellowRGB = "rgb( " + brightYellowPercent + " , " + brightYellowPercent + " , " + desatPercent + " ) ";
        let DarkYellowRGB = "rgb( " + darkYellowPercent + " , " + darkYellowPercent + " , " + desatPercent + " ) ";


        const colorsF1 = [
            RedRGB,  // Red
            GreenRGB,  // Green
            RedRGB,  // Red
            GreenRGB  // Green
        ]

        const colorsF2 = [
            DarkYellowRGB,  // Dark Yellow
            BrightYellowRGB,  // Light Yellow
            DarkYellowRGB,  // Dark Yellow
            BrightYellowRGB,  // Light Yellow
            DarkYellowRGB  // Dark Yellow
        ]

        const colorsF3 = [
            GreenRGB,  // Green
            RedRGB,  // Red
            GreenRGB, // Green
            RedRGB  // Red
        ]

        const colorsF4 = [

            BrightYellowRGB,  // Light Yellow
            DarkYellowRGB,  // Dark Yellow
            BrightYellowRGB,  // Light Yellow
            DarkYellowRGB,  // Dark Yellow
            BrightYellowRGB  // Light Yellow
        ]

        function drawBars(colors) {
            // Set canvas resolution to match the window size
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            //colors = colorsF3;
            
            let totalBars = colors.length;

            if ( totalBars > 4 ) {
                totalBars = totalBars;
            }
            
            // Calculate individual bar width so that exactly 'totalBars' fit the screen width
            const barWidth = canvas.width / 4;
            
            // Calculate the starting X offset (half a bar width to the left)
            let startX = 0;
            if ( totalBars > 4) {
                startX = -barWidth / 2;
            }

            // Draw 6 bars so the screen stays completely filled despite the negative offset
            for (let i = 0; i <= totalBars; i++) {
                // Use modulo to cycle through the 5 colors for the 6th bar
                ctx.fillStyle = colors[i % totalBars];
                
                // Calculate the X position for the current bar
                const xPos = startX + (i * barWidth);
                
                // Draw the vertical bar spanning the full height of the canvas
                ctx.fillRect(xPos, 0, barWidth, canvas.height);
            }
        }

        // Initial draw
        drawBars(colorsF1);
        drawBars(colorsF2);

        function frame1() {
            drawBars(colorsF1);
        }
    
        function frame2() {
            drawBars(colorsF2);
        }

        function frame3() {
            drawBars(colorsF3);
        }

        function frame4() {
            drawBars(colorsF4);
        }

        // Array holding the functions to cycle through
        const functionList = [frame1, frame2, frame3, frame4];
    
        // State management variables
        let currentIndex = 0;
        let delay = 42; // default 24fps 1 second is 1000 ms
 
        // 1. Retrieve the value from sessionStorage using the exact key name
        const saveddelay = sessionStorage.getItem("savedspeed");

        // 2. Use the retrieved data on your page (or fallback if empty)
        //if (saveddelay) {
        //    delay = saveddelay ;
        //} else {
        //    delay = 42;
        //}
        
        let timerId = null;
        let isRunning = true;
        // 2. The core loop logic using recursive setTimeout to handle dynamic speed changes
        function runLoop() {
            if (!isRunning) return;

            // Execute the current function in the sequence
            functionList[currentIndex]();

            // Move to the next index, resetting to 0 when reaching the end
            currentIndex = (currentIndex + 1) % functionList.length;

            // Schedule the next execution with the current delay value
            timerId = setTimeout(runLoop, delay);
        }
        // Select the input field by its ID
        const inputField = document.getElementById('quantity');

        // Listen for keypress events on the input field
        inputField.addEventListener('keydown', function(event) {
            // Check if the pressed key is 'Enter'
            if (event.key === 'Enter') {
                // Prevent default form submission behavior if applicable
                event.preventDefault(); 
                
                // Get the text inside the input box
                const enteredValue = inputField.value;
                
                // Show the alert box with the value
                alert("Delay entered: " + enteredValue);
                delay = enteredValue;
            }
        });

        // Automatically start the loop on page load
        runLoop();

        // Redraw automatically whenever the window size changes
        window.addEventListener('resize', drawBars);
    </script>
</body>
</html>
