<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Color Blindness Sequence</title>
    <style>
        /* Remove default margins and hide scrollbars to perfectly fill the viewport */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111; /* Dark background to see the edge offsets clearly */
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .home-btn {
            background-color: #333333;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .home-btn:hover {
            background-color: #444444;
        }
    </style>
</head>
<body>
    <header class="header">
        <!-- Replace href="#" with your landing page URL if needed -->
        <a href="index.html" class="home-btn">🏠 Home</a>
    </header>

    <canvas id="barCanvas"></canvas>

    <script>
        const canvas = document.getElementById('barCanvas');
        const ctx = canvas.getContext('2d');

        const colorsF1 = [
            "rgb(100%, 10%, 10%)",  // Red
            "rgb(10%, 100%, 10%)",  // Green
            "rgb(100%, 10%, 10%)",  // Red
            "rgb(10%, 100%, 10%)"  // Green
        ]

        const colorsF2 = [
            "rgb(50%, 50%, 10%)",  // Dark Yellow
            "rgb(100%, 100%, 10%)",  // Light Yellow
            "rgb(50%, 50%, 10%)",  // Dark Yellow
            "rgb(100%, 100%, 10%)",  // Light Yellow
            "rgb(50%, 50%, 10%)"  // Dark Yellow
        ]

        const colorsF3 = [
            "rgb(10%, 100%, 10%)",  // Green
            "rgb(100%, 10%, 10%)",  // Red
            "rgb(10%, 100%, 10%)", // Green
            "rgb(100%, 10%, 10%)"  // Red
        ]

        const colorsF4 = [

            "rgb(100%, 100%, 10%)",  // Light Yellow
            "rgb(50%, 50%, 10%)",  // Dark Yellow
            "rgb(100%, 100%, 10%)",  // Light Yellow
            "rgb(50%, 50%, 10%)",  // Dark Yellow
            "rgb(100%, 100%, 10%)"  // Light Yellow
        ]

        function drawBars(colors) {
            // Set canvas resolution to match the window size
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            //colors = colorsF3;
            
            let totalBars = colors.length;

            if ( totalBars > 4 ) {
                totalBars = totalBars;
            }
            
            // Calculate individual bar width so that exactly 'totalBars' fit the screen width
            const barWidth = canvas.width / 4;
            
            // Calculate the starting X offset (half a bar width to the left)
            let startX = 0;
            if ( totalBars > 4) {
                startX = -barWidth / 2;
            }

            // Draw 6 bars so the screen stays completely filled despite the negative offset
            for (let i = 0; i <= totalBars; i++) {
                // Use modulo to cycle through the 5 colors for the 6th bar
                ctx.fillStyle = colors[i % totalBars];
                
                // Calculate the X position for the current bar
                const xPos = startX + (i * barWidth);
                
                // Draw the vertical bar spanning the full height of the canvas
                ctx.fillRect(xPos, 0, barWidth, canvas.height);
            }
        }

        // Initial draw
        drawBars(colorsF1);
        drawBars(colorsF2);

        function frame1() {
            drawBars(colorsF1);
        }
    
        function frame2() {
            drawBars(colorsF2);
        }

        function frame3() {
            drawBars(colorsF3);
        }

        function frame4() {
            drawBars(colorsF4);
        }

        // Array holding the functions to cycle through
        const functionList = [frame1, frame2, frame4, frame4];
    
        // State management variables
        let currentIndex = 0;
        let delay = 100; // default 1 second is 1000
        let timerId = null;
        let isRunning = true;
        // 2. The core loop logic using recursive setTimeout to handle dynamic speed changes
        function runLoop() {
            if (!isRunning) return;

            // Execute the current function in the sequence
            functionList[currentIndex]();

            // Move to the next index, resetting to 0 when reaching the end
            currentIndex = (currentIndex + 1) % functionList.length;

            // Schedule the next execution with the current delay value
            timerId = setTimeout(runLoop, delay);
        }

        // Automatically start the loop on page load
        runLoop();

        // Redraw automatically whenever the window size changes
        window.addEventListener('resize', drawBars);
    </script>
</body>
</html>
