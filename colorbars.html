<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical Bars with Brightness Control</title>
    <style>
        /* Base page layout with a solid black background */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Container for the 4 vertical color bars */
        .bars-container {
            display: flex;
            width: 100%;
            height: 85vh; /* Takes up most of the screen */
        }

        /* Shared styles for each vertical bar */
        .bar {
            flex: 1;
            height: 100%;
            transition: filter 0.1s ease; /* Smooth transition when adjusting brightness */
            /* Initial brightness value controlled by CSS Variable */
            filter: brightness(var(--brightness-level, 1)); 
        }

        /* 4 Different Colors */
        .bar-1 { background-color: #ff3333; } /* Vibrant Red */
        .bar-2 { background-color: #33cc33; } /* Vibrant Green */
        .bar-3 { background-color: #3333ff; } /* Vibrant Blue */
        .bar-4 { background-color: #ffff33; } /* Vibrant Yellow */

        /* Control panel area at the bottom */
        .controls {
            height: 15vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #111111;
            border-top: 1px solid #222222;
            z-index: 10;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        label {
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        input[type="range"] {
            width: 250px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Vertical Bars -->
    <div class="bars-container" id="barsContainer">
        <div class="bar bar-1"></div>
        <div class="bar bar-2"></div>
        <div class="bar bar-3"></div>
        <div class="bar bar-4"></div>
    </div>

    <!-- Brightness Controller -->
    <div class="controls">
        <div class="slider-group">
            <label for="brightnessSlider">Brightness:</label>
            <input 
                type="range" 
                id="brightnessSlider" 
                min="0" 
                max="100" 
                value="100"
            >
            <span id="brightnessValue">100%</span>
        </div>
    </div>

    <!-- JavaScript for Dynamic Control -->
    <script>
        const slider = document.getElementById('brightnessSlider');
        const valueDisplay = document.getElementById('brightnessValue');
        const barsContainer = document.getElementById('barsContainer');

        // Listen for input adjustments on the slider
        slider.addEventListener('input', (event) => {
            const value = event.target.value;
            
            // Display the current percentage text
            valueDisplay.textContent = `${value}%`;
            
            // Convert 0-100 scale into a 0-1 decimal value for the CSS filter
            const decimalBrightness = value / 100;
            
            // Apply the brightness property to the container styling variable
            barsContainer.style.setProperty('--brightness-level', decimalBrightness);
        });
    </script>
</body>
</html>
