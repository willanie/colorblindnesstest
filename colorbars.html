<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Bars with Brightness Control</title>
    <style>
        /* Reset and set black background */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top navigation bar for the home button */
        .nav-bar {
            height: 60px;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background-color: #111111;
            border-bottom: 1px solid #222222;
            z-index: 10;
        }

        .home-btn {
            background-color: #333333;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .home-btn:hover {
            background-color: #444444;
        }

        /* Container for the 4 vertical bars */
        .bars-container {
            flex: 1;
            display: flex;
            width: 100%;
            height: calc(100vh - 60px);
        }

        /* Individual vertical bar wrapper */
        .bar-wrapper {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 40px;
            position: relative;
        }

        /* The actual colored bar that gets dimmed */
        .color-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transition: filter 0.05s linear;
        }

        /* Assigning 4 distinct base colors */
        #color-1 { background-color: #ff3b30; } /* Red */
        #color-2 { background-color: #34c759; } /* Green */
        #color-3 { background-color: #007aff; } /* Blue */
        #color-4 { background-color: #ffcc00; } /* Yellow */

        /* Control panel overlay sitting on top of the color */
        .control-panel {
            position: relative;
            z-index: 2;
            background-color: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            width: 85%;
            max-width: 160px;
        }

        .bar-label {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /* Horizontal slider styling for perfect stability */
        .brightness-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: #444444;
            outline: none;
            border-radius: 3px;
            cursor: pointer;
        }

        /* Slider Thumb customizing */
        .brightness-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 6px rgba(0,0,0,0.5);
        }

        .brightness-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            box-shadow: 0 0 6px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- Navigation Header with Home Button -->
    <header class="nav-bar">
        <a href="index.html" class="home-btn">
            🏠 Home
        </a>
    </header>

    <!-- Main Container for the 4 Vertical Bars -->
    <main class="bars-container">
        
        <!-- Bar 1: Red -->
        <div class="bar-wrapper">
            <div id="color-1" class="color-layer"></div>
            <div class="control-panel">
                <span class="bar-label">Red</span>
                <input type="range" class="brightness-slider" min="0" max="100" value="100" data-target="color-1">
            </div>
        </div>

        <!-- Bar 2: Green -->
        <div class="bar-wrapper">
            <div id="color-2" class="color-layer"></div>
            <div class="control-panel">
                <span class="bar-label">Green</span>
                <input type="range" class="brightness-slider" min="0" max="100" value="100" data-target="color-2">
            </div>
        </div>

        <!-- Bar 3: Blue -->
        <div class="bar-wrapper">
            <div id="color-3" class="color-layer"></div>
            <div class="control-panel">
                <span class="bar-label">Blue</span>
                <input type="range" class="brightness-slider" min="0" max="100" value="100" data-target="color-3">
            </div>
        </div>

        <!-- Bar 4: Yellow -->
        <div class="bar-wrapper">
            <div id="color-4" class="color-layer"></div>
            <div class="control-panel">
                <span class="bar-label">Yellow</span>
                <input type="range" class="brightness-slider" min="0" max="100" value="100" data-target="color-4">
            </div>
        </div>

    </main>

    <!-- JavaScript to handle brightness smoothly -->
    <script>
        document.querySelectorAll('.brightness-slider').forEach(slider => {
            // "input" handles real-time dragging on desktops and mobile touch screens
            slider.addEventListener('input', (event) => {
                const targetId = event.target.getAttribute('data-target');
                const targetLayer = document.getElementById(targetId);
                const value = event.target.value;
                
                // Directly applies the slider value (0 to 100) as a percentage
                targetLayer.style.filter = `brightness(${value}%)`;
            });
        });
    </script>
</body>
</html>
