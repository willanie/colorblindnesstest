<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Bars Brightness Control</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 20px;
            width: calc(100% - 40px);
            display: flex;
            justify-content: flex-start;
            z-index: 10;
        }

        .home-btn {
            background-color: #222222;
            color: #ffffff;
            border: 1px solid #444444;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            text-decoration: none;
        }

        .home-btn:hover {
            background-color: #333333;
            border-color: #666666;
        }

        .container {
            display: flex;
            gap: 40px;
            width: 100%;
            max-width: 900px;
            height: 70vh;
            align-items: flex-end;
            justify-content: center;
            margin-top: 40px;
        }

        .column {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
            flex: 1;
            max-width: 120px;
        }

        .bar-wrapper {
            width: 100%;
            height: 70%;
            background-color: #111111;
            border-radius: 8px;
            display: flex;
            align-items: flex-end;
            overflow: hidden;
            border: 1px solid #222222;
        }

        .bar {
            width: 100%;
            height: 100%;
            transition: filter 0.1s ease;
        }

        /* Unique base colors for each vertical bar */
        #bar-1 { background-color: #ff3b30; } /* Red */
        #bar-2 { background-color: #34c759; } /* Green */
        #bar-3 { background-color: #007aff; } /* Blue */
        #bar-4 { background-color: #ffcc00; } /* Yellow */

        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #333333;
            outline: none;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: none;
        }

        .inputs-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .text-input {
            width: 60px;
            background-color: #111111;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 6px;
            border-radius: 4px;
            text-align: center;
            font-size: 0.9rem;
        }

        .text-input:focus {
            outline: none;
            border-color: #007aff;
        }

        .unit {
            font-size: 0.9rem;
            color: #888888;
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- Set the href to your actual home page link if needed -->
        <a href="#" class="home-btn" onclick="alert('Home button clicked!')">Home</a>
    </div>

    <div class="container">
        <!-- Bar 1: Red -->
        <div class="column">
            <div class="bar-wrapper">
                <div id="bar-1" class="bar"></div>
            </div>
            <div class="controls">
                <input type="range" id="slider-1" class="slider" min="0" max="100" value="100">
                <div class="inputs-wrapper">
                    <input type="text" id="text-1" class="text-input" value="100">
                    <span class="unit">%</span>
                </div>
            </div>
        </div>

        <!-- Bar 2: Green -->
        <div class="column">
            <div class="bar-wrapper">
                <div id="bar-2" class="bar"></div>
            </div>
            <div class="controls">
                <input type="range" id="slider-2" class="slider" min="0" max="100" value="100">
                <div class="inputs-wrapper">
                    <input type="text" id="text-2" class="text-input" value="100">
                    <span class="unit">%</span>
                </div>
            </div>
        </div>

        <!-- Bar 3: Blue -->
        <div class="column">
            <div class="bar-wrapper">
                <div id="bar-3" class="bar"></div>
            </div>
            <div class="controls">
                <input type="range" id="slider-3" class="slider" min="0" max="100" value="100">
                <div class="inputs-wrapper">
                    <input type="text" id="text-3" class="text-input" value="100">
                    <span class="unit">%</span>
                </div>
            </div>
        </div>

        <!-- Bar 4: Yellow -->
        <div class="column">
            <div class="bar-wrapper">
                <div id="bar-4" class="bar"></div>
            </div>
            <div class="controls">
                <input type="range" id="slider-4" class="slider" min="0" max="100" value="100">
                <div class="inputs-wrapper">
                    <input type="text" id="text-4" class="text-input" value="100">
                    <span class="unit">%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Setup synchronization for all 4 control sets
        for (let i = 1; i <= 4; i++) {
            const bar = document.getElementById(`bar-${i}`);
            const slider = document.getElementById(`slider-${i}`);
            const textInput = document.getElementById(`text-${i}`);

            function updateBrightness(value) {
                // Ensure value stays between 0 and 100
                let cleanValue = Math.min(Math.max(parseInt(value) || 0, 0), 100);
                
                // Apply brightness via CSS filter
                bar.style.filter = `brightness(${cleanValue}%)`;
                
                // Sync values across UI components
                slider.value = cleanValue;
                if (document.activeElement !== textInput) {
                    textInput.value = cleanValue;
                }
            }

            // Listen for slider changes
            slider.addEventListener('input', (e) => {
                updateBrightness(e.target.value);
            });

            // Listen for typing input
            textInput.addEventListener('input', (e) => {
                updateBrightness(e.target.value);
            });

            // Validate and clean up input when user clicks away
            textInput.addEventListener('blur', (e) => {
                let cleanValue = Math.min(Math.max(parseInt(e.target.value) || 0, 0), 100);
                textInput.value = cleanValue;
            });
        }
    </script>
</body>
</html>
