<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Home Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center; /* Centers the text and inline elements */
            margin-top: 100px;
        }
        .center-btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
        .center-btn:hover {
            background-color: #0056b3;
        }

        /* Makes the Giphy embed responsive */
        .gif-container {
            width: 240px;
            max-width: 240px;
            height:0; 
            padding-bottom:100%;
            position: relative;
            margin: 0 auto;
            margin-top: 3vh;
        }
        .gif-container iframe {
            pointer-events: none; /* Prevents users from clicking to pause */
        }

    </style>
</head>
<body>

    <h1>Hi Steve</h1>
    <p>This is a short description paragraph explaining what this page is about.</p>
    
    <!-- Button wrapped in an anchor tag to go to another page -->
    <a href="colorbars.html" class="center-btn">RUN COLOR BAR SETUP</a>
    <a href="animatedcolorbars.html" class="center-btn">RUN COLOR BLINDNESS TEST</a>

    <!-- Embedded Giphy Code with Autoplay -->
    <div class="gif-container">
        <iframe src="https://giphy.com/embed/KAvlM8rLYEXkLTMMM5" 
                width="240" 
                height="135" 
                frameBorder="0" 
                class="giphy-embed" 
                allowFullScreen>
        </iframe>
    </div>


</body>
</html>
